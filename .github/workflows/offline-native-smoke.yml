name: Carbon native Android link smoke (no game files)

on:
  push:
    branches: [offline-singleplayer-bootstrap]
    paths:
      - '.github/workflows/offline-native-smoke.yml'
      - 'scripts/offline_native_smoke.c'
      - 'android/app/build.gradle'
      - 'android/app/src/main/cpp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-host-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Vulkan shader tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools spirv-tools
      - name: Locate Android SDK command line tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo "No Android sdkmanager is present" >&2
            exit 1
          fi
      - name: Install ARM64 Android toolchain
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.30.5'
      - name: Initialize open source DXVK/Android support
        run: |
          git config --global user.name 'Carbon CI'
          git config --global user.email 'noreply@users.noreply.github.com'
          python scripts/bootstrap_offline.py --setup
      - name: Compile and link Android host runtime without game binaries
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug -PnfsSmokeStub=ON -PnfsGuestLto=OFF -PnfsAbi=arm64-v8a
      - name: Validate native libraries in test APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libnfsc_android.so'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libnfsc_diagnostics.so'
          echo "Native host runtime linked successfully. This APK is NOT playable."
      - name: Upload smoke APK for build diagnostics (never release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nfsc-native-link-smoke-nonplayable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
      - name: Disclaimer
        if: always()
        run: |
          echo 'CI-only smoke fixture. No copyrighted game content was used or uploaded.'
          echo 'No playable APK can be made from the smoke placeholders.'
