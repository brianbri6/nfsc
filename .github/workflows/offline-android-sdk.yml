name: Carbon offline Android SDK cache

on:
  push:
    branches: [offline-singleplayer-bootstrap]
    paths: ['.github/workflows/offline-android-sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-offline-android-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The old setup-android action requests the removed SDK package 'tools'.
      # Use the Ubuntu runner's already-installed cmdline-tools instead.
      - name: Locate current Android command-line tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo 'No preinstalled Android sdkmanager found' >&2; exit 1
          fi
      - name: Accept standard SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install specific Android build requirements
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.30.5'
          echo "ANDROID_HOME=$ANDROID_HOME"
          du -sh "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/cmake/3.30.5"
      - name: Cache Gradle runtime and application plugin dependencies
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:tasks
          du -sh "$HOME/.gradle"
      - name: Assemble temporary SDK tarball (no game code)
        run: |
          tar -C "$ANDROID_HOME" -czf /tmp/nfsc-android-sdk.tar.gz platforms/android-35 build-tools/35.0.0 ndk/28.2.13676358 cmake/3.30.5 licenses
          tar -C "$HOME" -czf /tmp/nfsc-gradle-cache.tar.gz --exclude='*.lock' --exclude='daemon' .gradle
          ls -lh /tmp/nfsc-android-sdk.tar.gz /tmp/nfsc-gradle-cache.tar.gz
          # GitHub connector download caps individual files at 512 MiB.
          split -b 275m -d -a 2 /tmp/nfsc-android-sdk.tar.gz /tmp/nfsc-sdk-part-
          ls -lh /tmp/nfsc-sdk-part-*
      - uses: actions/upload-artifact@v4
        with:
          name: nfsc-sdk-part-00
          path: /tmp/nfsc-sdk-part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nfsc-sdk-part-01
          path: /tmp/nfsc-sdk-part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nfsc-sdk-part-02
          path: /tmp/nfsc-sdk-part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nfsc-sdk-part-03
          path: /tmp/nfsc-sdk-part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
