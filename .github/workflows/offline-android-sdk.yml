name: Carbon offline Android SDK cache

on:
  push:
    branches: [offline-singleplayer-bootstrap]
    paths: ['.github/workflows/offline-android-sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-offline-android-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install specific Android build requirements
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.30.5'
          echo "ANDROID_HOME=$ANDROID_HOME"
          du -sh "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0" "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/cmake/3.30.5"
      - name: Cache Gradle runtime and application plugin dependencies
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:tasks
          du -sh "$HOME/.gradle"
      - name: Assemble temporary SDK tarball (no game code)
        run: |
          tar -C "$ANDROID_HOME" -czf /tmp/nfsc-android-sdk.tar.gz platforms/android-35 build-tools/35.0.0 ndk/28.2.13676358 cmake/3.30.5 licenses
          tar -C "$HOME" -czf /tmp/nfsc-gradle-cache.tar.gz --exclude='*.lock' --exclude='daemon' .gradle
          ls -lh /tmp/nfsc-android-sdk.tar.gz /tmp/nfsc-gradle-cache.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nfsc-android-sdk-offline
          path: /tmp/nfsc-android-sdk.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nfsc-gradle-cache-offline
          path: /tmp/nfsc-gradle-cache.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
